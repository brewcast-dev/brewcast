<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1208"/>
      <stop offset="1" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="none" stroke="#3a2a14" stroke-width="2"/>

  <!-- Wordmark -->
  <text x="600" y="210" text-anchor="middle" font-size="92" font-weight="800" fill="#f5e6c8" letter-spacing="-2">🍺 BrewCast</text>

  <!-- Tagline -->
  <text x="600" y="270" text-anchor="middle" font-size="27" fill="#a8917a">An AI social-media manager for breweries</text>

  <!-- Pipeline chips -->
  <g font-size="20" font-weight="600">
    <g transform="translate(170,360)">
      <rect width="180" height="56" rx="28" fill="#181410" stroke="#3a2a14"/>
      <text x="90" y="35" text-anchor="middle" fill="#f5e6c8">📸 Analyze</text>
    </g>
    <g transform="translate(370,360)">
      <rect width="180" height="56" rx="28" fill="#181410" stroke="#3a2a14"/>
      <text x="90" y="35" text-anchor="middle" fill="#f5e6c8">🎨 Design</text>
    </g>
    <g transform="translate(570,360)">
      <rect width="180" height="56" rx="28" fill="#181410" stroke="#3a2a14"/>
      <text x="90" y="35" text-anchor="middle" fill="#f5e6c8">✍️ Caption</text>
    </g>
    <g transform="translate(770,360)">
      <rect width="180" height="56" rx="28" fill="#181410" stroke="#3a2a14"/>
      <text x="90" y="35" text-anchor="middle" fill="#f5e6c8">📅 Publish</text>
    </g>
    <g transform="translate(485,440)">
      <rect width="230" height="56" rx="28" fill="url(#amber)"/>
      <text x="115" y="35" text-anchor="middle" fill="#0c0a09">📈 Track reach &amp; ads</text>
    </g>
  </g>

  <!-- Stack line -->
  <text x="600" y="560" text-anchor="middle" font-size="19" fill="#6b5a44" letter-spacing="1">
    Next.js · Gemini 2.5 Flash Image · Supabase · Meta Graph &amp; Marketing API · Vercel
  </text>
</svg>
